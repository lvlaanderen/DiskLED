;
; Configuration file for DiskLED
; Original by Helge Klein, https://helgeklein.com
; Fork by Lourens Vlaanderen, https://github.com/lvlaanderen/DiskLED
;
; Everything can also be set in the configuration dialog (double-click the tray icon).
; Tick "Update the INI file when applying settings" there to save your choices into this file.
;
; Lines starting with a semicolon are comments. All settings below are commented out,
; DiskLED then shows disk activity as a flickering LED. To use an example, remove the
; semicolons of its lines. Use only one of the icon type examples at a time.
;

[Performance Counter 1]

; ------------------------------------------------------------------------
; Example 1: flickering disk activity LED (the default)
; ------------------------------------------------------------------------

; LEDType=Flicker
; Path=\PhysicalDisk(_Total)\% Disk Time
; UpdateInterval=30

; ------------------------------------------------------------------------
; Example 2: internet download and upload speed as two bars side by side
; Use the name of your network adapter as shown in perfmon.msc.
; 100% Utilization is in bytes per second: a 350 Mbit/s line is 350000000 / 8 = 43750000
; ------------------------------------------------------------------------

; LEDType=VUMeter
; UpdateInterval=1000
; SecondCounter=1
; Path=\Network Adapter(<your adapter>)\Bytes Received/sec
; 100% Utilization=43750000
; ValueFormat=Bits
; ScaleMode=Decay

; [Performance Counter 2]
; Path=\Network Adapter(<your adapter>)\Bytes Sent/sec
; 100% Utilization=12500000
; ValueFormat=Bits
; ScaleMode=Decay

; ------------------------------------------------------------------------
; Example 3: memory used as a number, with a warning above 90% for one minute
; 100% Utilization is your installed memory in MB
; ------------------------------------------------------------------------

; LEDType=Number
; UpdateInterval=1000
; Path=\Memory\Available MBytes
; 100% Utilization=65536
; ValueFormat=MBytes
; Invert=1
; AlertAbove=90
; AlertSeconds=60

; ------------------------------------------------------------------------
; All settings
; ------------------------------------------------------------------------

; Icon type: Flicker, ColoredBar, CleanBar, VUMeter, Graph or Number
; LEDType=Flicker

; Counter path as shown in perfmon.msc. English names work on every Windows language.
; Path=\PhysicalDisk(_Total)\% Disk Time

; Milliseconds between updates, 10 to 3600000. About 1000 suits the graph.
; UpdateInterval=30

; The counter value that corresponds to 100%
; 100% Utilization=100

; How values are shown in the tooltip and the number icon: Percent, Number, Bytes, Bits or MBytes
; ValueFormat=Percent

; What corresponds to the full icon: Fixed (the 100% value), Peak (highest of the last 16 values)
; or Decay (a peak that falls by half every 30 seconds). With Peak and Decay the 100% value is the minimum.
; ScaleMode=Fixed

; 1 = show the 100% value minus the counter value, e.g. memory used from memory available
; Invert=0

; Show a notification when the value stays above this percentage of the 100% value for this many seconds.
; 0 = no warning.
; AlertAbove=0
; AlertSeconds=10

; 1 = show a second counter, configured in the section [Performance Counter 2]
; SecondCounter=0

; Colours (RRGGBB) for low, medium and high load, and the percentages of the scale where medium and high start
; ColorLow=00DC00
; ColorMid=FFC800
; ColorHigh=FF2800
; ThresholdMid=50
; ThresholdHigh=75
